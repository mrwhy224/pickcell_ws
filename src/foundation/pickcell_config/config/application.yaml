# This is the single configuration file used by system.launch.py.
# With a symlink build, change target_pose here and relaunch; no rebuild needed.
system:
  namespace: pickcell
  use_sim_time: false
  robot:
    # Exact KR 180 ROS meshes are unavailable; description uses the maintained
    # same-family/same-reach KR 240 R2900-2 geometry as a temporary proxy.
    model: kr180_r2900_2
    mode: sim
    # Publishes the configured pose until a simulator or hardware driver exists.
    joint_state_source: simulation_topic
    joint_state_rate_hz: 10
    # Valid bent pose for RViz testing. Joint 2 must remain between -140 and
    # -5 degrees for this QUANTEC model, so an all-zero pose is invalid.
    initial_joint_positions_deg:
      joint_1: 20.0
      joint_2: -45.0
      joint_3: 60.0
      joint_4: 11.0
      joint_5: 30.0
      joint_6: 10.0
    xacro_arguments:
      robot_prefix: ""
      robot_mount_xyz: "0 0 0"
      robot_mount_rpy: "0 0 0"
      # Keep this at zero until the real gripper/TCP is selected.
      tcp_xyz: "0 0 0"
      tcp_rpy: "0 0 0"
  tf:
    enabled: true
    description_package: pickcell_description
    xacro_file: urdf/pickcell.urdf.xacro
  moveit:
    enabled: true
    config_package: pickcell_moveit_config
    semantic_file: config/pickcell.srdf
    kinematics_file: config/kinematics.yaml
    joint_limits_file: config/joint_limits.yaml
    planning_pipeline: ompl
    planning_pipeline_file: config/ompl_planning.yaml
    allow_trajectory_execution: false
    publish_monitored_planning_scene: true
  visualization:
    enabled: true
    package: pickcell_description
    rviz_config: rviz/pickcell.rviz

nodes:
  joint_state_sim:
    mode: sim
    package: pickcell_mock_nodes
    executable: joint_state_sim
    parameters:
      joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
      initial_positions_deg: [20.0, -45.0, 60.0, 11.0, 30.0, 10.0]

  point_cloud_mock:
    mode: mock
    package: pickcell_mock_nodes
    executable: point_cloud_mock
    parameters:
      frame_id: cell
      publish_rate_hz: 2.0
      cloud_points: [
        0.40, -0.10, 0.10,
        0.40, -0.05, 0.10,
        0.40,  0.00, 0.10,
        0.40,  0.05, 0.10,
        0.40,  0.10, 0.10,
        0.45, -0.10, 0.10,
        0.45, -0.05, 0.10,
        0.45,  0.00, 0.10,
        0.45,  0.05, 0.10,
        0.45,  0.10, 0.10,
      ]
      # One planning target: [X, Y, Z, A, B, C].
      # XYZ is in metres; KUKA-style ABC (Z-Y-X) is in degrees.
      target_pose: [2.00, 1.0, 2.00, 50.0, 40.0, 0.0]
      # TF child frame broadcast from frame_id using target_pose.
      target_frame_id: motion_planning_target
      point_cloud_topic: planning/point_cloud
      target_topic: planning/target_pose

  motion_solver:
    mode: sim
    package: pickcell_motion_server
    executable: motion_solver
    parameters:
      joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
      joint_lower_limits: [-3.2288591162, -2.4434609528, -2.0943951024, -6.1086523820, -2.1380283337, -6.1086523820]
      joint_upper_limits: [3.2288591162, -0.0872664626, 2.9321531434, 6.1086523820, 2.1380283337, 6.1086523820]
      initial_positions_deg: [20.0, -45.0, 60.0, 11.0, 30.0, 10.0]
      optimizer_weights: [1.0, 1.0, 1.0, 0.5, 0.5, 0.25]
      group_name: manipulator
      end_effector_link: gripper_tcp
      base_frame: robot_base
      target_frame: motion_planning_target
      ik_timeout_seconds: 0.05
